<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Візитка — Олена Петренко</title>
  <style>
    :root {
      --blue: #2050a0;
      --gray: #666;
      --bg: #f4f4f4;
      --white: #fff;
      --radius: 8px;
      --gap: 16px;
    }
 
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: #222;
      padding: 16px;
    }
 
    .header {
      background: var(--blue);
      color: var(--white);
      padding: 20px;
      border-radius: var(--radius);
      text-align: center;
      margin-bottom: var(--gap);
    }
 
    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto 10px;
    }
 
    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: var(--gap);
    }
 
    .card h2 { color: var(--blue); margin-bottom: 8px; font-size: 15px; }
    .card p, .card li { color: var(--gray); font-size: 14px; line-height: 1.6; }
 
    .skills { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; }
    .skills li {
      border: 1px solid var(--blue);
      color: var(--blue);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
 
    label { display: block; font-size: 13px; color: var(--gray); margin: 10px 0 3px; }
    input, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: var(--radius);
      font-size: 14px;
    }
 
    button {
      margin-top: 12px;
      background: var(--blue);
      color: var(--white);
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
 
    button:hover { opacity: 0.85; }
 
    /* планшет — 2 колонки */
    @media (min-width: 768px) {
      .header { display: flex; align-items: center; text-align: left; gap: 16px; }
      .avatar { margin: 0; flex-shrink: 0; }
      .layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
      button { width: auto; }
    }
 
    /* десктоп — 3 колонки */
    @media (min-width: 1200px) {
      body { padding: 40px; max-width: 1200px; margin: 0 auto; }
      .layout { grid-template-columns: 1fr 1fr 1fr; }
    }
  </style>
</head>
<body>
 
  <div class="header">
    <div class="avatar">ОП</div>
    <div>
      <h1>Олена Петренко</h1>
      <p>Frontend Developer · Київ</p>
    </div>
  </div>
 
  <div class="layout">
 
    <div class="card">
      <h2>Про мене</h2>
      <p>Веб-розробник з 3 роками досвіду. Захоплююсь адаптивним дизайном та доступністю.</p>
    </div>
 
    <div class="card">
      <h2>Навички</h2>
      <ul class="skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>React</li>
        <li>Git</li>
        <li>Figma</li>
      </ul>
    </div>
 
    <div class="card">
      <h2>Написати мені</h2>
      <label>Ім'я</label>
      <input type="text" placeholder="Ваше ім'я">
      <label>Email</label>
      <input type="email" placeholder="email@example.com">
      <label>Повідомлення</label>
      <textarea rows="4" placeholder="Ваше повідомлення..."></textarea>
      <button>Надіслати</button>
    </div>
 
  </div>
 
</body>
</html>
